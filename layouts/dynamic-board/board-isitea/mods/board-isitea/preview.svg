<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#f6f7f9"/>
  <!-- header: title, filter chips, +, settings -->
  <rect width="320" height="34" fill="#ffffff"/>
  <g fill="#7465db"><rect x="10" y="6" width="2" height="7" rx="1"/><rect x="13" y="8" width="2" height="5" rx="1"/><rect x="16" y="5" width="2" height="8" rx="1"/></g>
  <text x="22" y="13" font-family="sans-serif" font-size="8" font-weight="600" fill="#252b37">Agent board</text>
  <rect x="268" y="5" width="44" height="10" rx="2" fill="#ffffff" stroke="#e5e7ec"/>
  <text x="272" y="12" font-family="sans-serif" font-size="5" fill="#252b37">← Default</text>
  <g font-family="sans-serif" font-size="5">
    <rect x="10" y="20" width="22" height="9" rx="2" fill="#eeebfc" stroke="#ddd7f9"/><text x="14" y="26.5" fill="#7465db">Board</text>
    <rect x="35" y="20" width="34" height="9" rx="2" fill="#ffffff" stroke="#e5e7ec"/><text x="39" y="26.5" fill="#737b89">Machine ▾</text>
    <rect x="72" y="20" width="30" height="9" rx="2" fill="#ffffff" stroke="#e5e7ec"/><text x="76" y="26.5" fill="#737b89">Space ▾</text>
    <rect x="105" y="20" width="30" height="9" rx="2" fill="#ffffff" stroke="#e5e7ec"/><text x="109" y="26.5" fill="#737b89">Agent ▾</text>
  </g>
  <g fill="#ffffff" stroke="#e5e7ec"><rect x="290" y="20" width="9" height="9" rx="2"/><rect x="302" y="20" width="9" height="9" rx="2"/></g>
  <g stroke="#5f6775" stroke-width="0.8"><path d="M294.5 22.5v4m-2-2h4"/></g><circle cx="306.5" cy="24.5" r="1.8" fill="none" stroke="#5f6775" stroke-width="0.8"/>
  <!-- folded (empty) columns: titles only, stacked at the left -->
  <g font-family="sans-serif" font-size="5.5" fill="#89909d">
    <circle cx="12" cy="42" r="1.6" fill="#d79032"/><text x="16" y="44">Needs you 0</text>
    <circle cx="12" cy="51" r="1.6" fill="#39a380"/><text x="16" y="53">Done 0</text>
  </g>
  <!-- Working: an agent card and its sub-agent card (dashed) -->
  <g font-family="sans-serif" font-size="5.5" font-weight="600" fill="#252b37">
    <circle cx="60" cy="42" r="1.6" fill="#7465db"/><text x="64" y="44">Working 2</text>
    <circle cx="140" cy="42" r="1.6" fill="#99a0ad"/><text x="144" y="44">Idle 6</text>
  </g>
  <rect x="58" y="48" width="72" height="24" rx="3" fill="#ffffff" stroke="#e5e7ec"/>
  <path d="M59 49.5v21" stroke="#7465db" stroke-width="2"/>
  <rect x="58" y="76" width="72" height="24" rx="3" fill="#fcfcfe" stroke="#c9cdd6" stroke-dasharray="2 1.5"/>
  <path d="M59 77.5v21" stroke="#7465db" stroke-width="2" opacity="0.55"/>
  <g font-family="sans-serif" font-size="4.5" fill="#7465db"><text x="64" y="96">↳ parent tab</text></g>
  <rect x="98" y="51" width="18" height="5" rx="1" fill="#f3f1fd" stroke="#ddd7f9" stroke-width="0.5"/>
  <text x="100" y="55" font-family="sans-serif" font-size="3.8" fill="#7465db">↳ 1 sub</text>
  <!-- Idle: cards flow two wide, with an always-visible scrollbar -->
  <g fill="#ffffff" stroke="#e5e7ec">
    <rect x="138" y="48" width="72" height="24" rx="3"/><rect x="214" y="48" width="72" height="24" rx="3"/>
    <rect x="138" y="76" width="72" height="24" rx="3"/><rect x="214" y="76" width="72" height="24" rx="3"/>
  </g>
  <g stroke="#99a0ad" stroke-width="2"><path d="M139 49.5v21m0 7v21m76-49v21m0 7v21"/></g>
  <rect x="290" y="48" width="2" height="52" rx="1" fill="#e5e7ec"/><rect x="290" y="48" width="2" height="30" rx="1" fill="#b7bcc6"/>
  <rect x="138" y="104" width="154" height="6" rx="2" fill="#edf0f4"/>
  <text x="192" y="108.5" font-family="sans-serif" font-size="4" fill="#99a0ad">6 cards · scroll ↕</text>
  <g stroke="#ccd0d9" stroke-width="1.2">
    <path d="M64 56h30m-30 6h42m-42 7h24"/><path d="M64 84h40m-40 6h24"/>
    <path d="M144 56h30m-30 6h44M220 56h30m-30 6h40M144 84h30m-30 6h40M220 84h30m-30 6h44"/>
  </g>
  <!-- live workspace: the active tab's terminals -->
  <rect x="0" y="116" width="320" height="64" fill="#f6f7f9"/>
  <rect x="10" y="120" width="300" height="7" rx="2" fill="#ffffff"/>
  <circle cx="15" cy="123.5" r="1.4" fill="#7465db"/><text x="19" y="125.5" font-family="sans-serif" font-size="4.5" font-weight="600" fill="#252b37">Live workspace</text>
  <rect x="10" y="130" width="300" height="44" rx="3" fill="#ffffff" stroke="#e5e7ec"/>
  <path d="M10 136h300" stroke="#e5e7ec"/>
  <g stroke="#ccd0d9" stroke-width="1.2"><path d="M16 142h80m-80 6h120m-120 6h60m-60 6h100m-100 6h40"/></g>
</svg>
