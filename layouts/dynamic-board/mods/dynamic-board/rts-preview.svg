<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <!-- rts-command: the Dynamic Board in the rts-command theme (green command console). -->
  <defs>
    <linearGradient id="work" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d140d"/><stop offset="1" stop-color="#060a06"/></linearGradient>
    <pattern id="scan" width="4" height="2" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#4fd35a" fill-opacity="0.04"/></pattern>
  </defs>
  <rect width="320" height="180" fill="#060a06"/>
  <!-- title bar: radar logo, COMMAND CONSOLE, filters | buttons -->
  <rect width="320" height="22" fill="#0d140d" stroke="#2f4a2c"/>
  <g fill="none" stroke="#4fd35a" stroke-width="0.9" transform="translate(6 5)">
    <circle cx="6" cy="6" r="5"/><circle cx="6" cy="6" r="2.8" stroke-dasharray="1 1"/>
    <path d="M6 6 9.5 2.5"/>
  </g>
  <g font-family="monospace" font-size="5">
    <rect x="21" y="6" width="50" height="10" rx="1" fill="#4fd35a26" stroke="#4fd35a8c"/><text x="25" y="12.8" fill="#4fd35a">COMMAND CONSOLE</text>
    <rect x="74" y="6" width="34" height="10" rx="1" fill="#101910" stroke="#2f4a2c"/><circle cx="78" cy="11" r="1.2" fill="#4fd35a"/><text x="81" y="12.8" fill="#7fa078">Machine ▾</text>
    <rect x="111" y="6" width="28" height="10" rx="1" fill="#101910" stroke="#2f4a2c"/><text x="114" y="12.8" fill="#7fa078">Space ▾</text>
    <rect x="252" y="6" width="22" height="10" rx="1" fill="#101910" stroke="#2f4a2c"/><text x="255" y="12.8" fill="#7fa078">Files</text>
    <text x="282" y="13" fill="#7fa078">–  ▢  ✕</text>
  </g>
  <!-- board: status columns with unit cards -->
  <g font-family="monospace" font-size="4.5">
    <circle cx="10" cy="32" r="1.6" fill="#ffb02e"/><text x="14" y="33.6" fill="#7fa078">Blocked</text>
    <circle cx="10" cy="41" r="1.6" fill="#6fd3c0"/><text x="14" y="42.6" fill="#7fa078">Done</text>
    <circle cx="52" cy="32" r="1.6" fill="#4fd35a"/><text x="56" y="33.6" fill="#b8e6b0">Working</text>
    <circle cx="160" cy="32" r="1.6" fill="#6b7f68"/><text x="164" y="33.6" fill="#b8e6b0">Idle</text>
  </g>
  <g stroke="#2f4a2c" stroke-width="0.8">
    <rect x="50" y="38" width="102" height="24" rx="1" fill="#0a0f0a"/><rect x="50" y="38" width="2" height="24" fill="#4fd35a" stroke="none"/>
    <rect x="50" y="66" width="102" height="24" rx="1" fill="#0a0f0a"/><rect x="50" y="66" width="2" height="24" fill="#4fd35a" stroke="none"/>
    <rect x="158" y="38" width="102" height="24" rx="1" fill="#0a0f0a"/>
    <rect x="158" y="66" width="102" height="24" rx="1" fill="#0a0f0a"/>
    <rect x="264" y="38" width="50" height="24" rx="1" fill="#0a0f0a" stroke-dasharray="2 1"/>
  </g>
  <g fill="#b8e6b0" fill-opacity="0.7">
    <rect x="56" y="43" width="30" height="2.5"/><rect x="56" y="50" width="48" height="3"/><rect x="56" y="56" width="22" height="2"/>
    <rect x="56" y="71" width="30" height="2.5"/><rect x="56" y="78" width="40" height="3"/><rect x="56" y="84" width="22" height="2"/>
    <rect x="164" y="43" width="30" height="2.5"/><rect x="164" y="50" width="44" height="3"/><rect x="164" y="56" width="22" height="2"/>
    <rect x="164" y="71" width="30" height="2.5"/><rect x="164" y="78" width="36" height="3"/><rect x="164" y="84" width="22" height="2"/>
    <rect x="270" y="43" width="26" height="2.5"/><rect x="270" y="50" width="34" height="3"/>
  </g>
  <rect y="96" width="320" height="1.5" fill="#2f4a2c"/>
  <!-- workspace: tab strip and a live terminal with a green focus frame -->
  <rect y="97.5" width="320" height="73" fill="url(#work)"/>
  <rect x="8" y="102" width="304" height="10" rx="1" fill="#0d140d" stroke="#2f4a2c" stroke-width="0.8"/>
  <rect x="24" y="104" width="34" height="6" rx="1" fill="#4fd35a26" stroke="#4fd35a8c" stroke-width="0.6"/>
  <rect x="8" y="115" width="304" height="52" rx="1" fill="#0a0f0a" stroke="#4fd35a" stroke-width="1.2"/>
  <g font-family="monospace" font-size="4.5" fill="#b8e6b0">
    <text x="14" y="128">&gt; status report</text>
    <text x="14" y="136" fill="#4fd35a">  all units operational</text>
    <text x="14" y="144" fill="#ffb02e">  1 unit awaiting orders</text>
    <text x="14" y="152">&gt; <tspan fill="#6fff7a">█</tspan></text>
  </g>
  <rect x="8" y="115" width="304" height="52" fill="url(#scan)"/>
  <!-- status bar -->
  <rect y="171" width="320" height="9" fill="#0d140d" stroke="#2f4a2c" stroke-width="0.6"/>
  <text x="6" y="177.5" font-family="monospace" font-size="4.5" fill="#7fa078">This computer · 3 agents</text>
</svg>
